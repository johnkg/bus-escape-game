name: Deploy web

# Every push builds the web demo and deploys it to Cloudflare Pages.
# `main` is the production site; other branches get their own preview URL.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "token length: ${#CF_TOKEN}, account id length: ${#CF_ACCOUNT}"
          echo "--- token verify"
          curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success'), d.get('errors'), (d.get('result') or {}).get('status'))"
          echo "--- accounts this token can see"
          curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success'), d.get('errors'), [(a['name'], a['id'][:6]) for a in d.get('result') or []])"
          echo "--- pages projects in the account id given"
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success'), d.get('errors'), [p['name'] for p in d.get('result') or []])"
        continue-on-error: true

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=bus-escape --branch=${{ github.ref_name }}
